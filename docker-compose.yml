version: '3.9'

x-default-opts:
  &default-opts
  logging:
    driver: "json-file"
    options:
      max-size: "10m"

networks:
  traefik-network:
    external: true

services:
  # Webhook - Recebe notificações do GitHub para atualizar containers
  webhook:
    <<: *default-opts
    image: archbase-webhook:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./webhook/hooks.json:/etc/webhook/hooks.json:ro
    command: -verbose -hooks=/etc/webhook/hooks.json -hotreload
    networks:
      - traefik-network
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.webhook.rule=Host(`deploy.archbase.dev`)"
        - "traefik.http.routers.webhook.entrypoints=websecure"
        - "traefik.http.routers.webhook.tls=true"
        - "traefik.http.routers.webhook.tls.certresolver=letsencrypt"
        - "traefik.http.services.webhook.loadbalancer.server.port=9000"

  # Site Principal - archbase.dev
  site:
    <<: *default-opts
    image: ghcr.io/integrall-tech/archbase-site:${SITE_TAG:-latest}
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.archbase-site.rule=Host(`archbase.dev`) || Host(`www.archbase.dev`)"
        - "traefik.http.routers.archbase-site.entrypoints=websecure"
        - "traefik.http.routers.archbase-site.tls=true"
        - "traefik.http.routers.archbase-site.tls.certresolver=letsencrypt"
        - "traefik.http.services.archbase-site.loadbalancer.server.port=80"
        - "traefik.http.routers.archbase-site-http.rule=Host(`archbase.dev`) || Host(`www.archbase.dev`)"
        - "traefik.http.routers.archbase-site-http.entrypoints=web"
        - "traefik.http.routers.archbase-site-http.middlewares=redirect-to-https"

  # Documentação React - react.archbase.dev
  react-docs:
    <<: *default-opts
    image: ghcr.io/integrall-tech/archbase-react-docs:${REACT_DOCS_TAG:-latest}
    networks:
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.archbase-react-docs.rule=Host(`react.archbase.dev`)"
        - "traefik.http.routers.archbase-react-docs.entrypoints=websecure"
        - "traefik.http.routers.archbase-react-docs.tls=true"
        - "traefik.http.routers.archbase-react-docs.tls.certresolver=letsencrypt"
        - "traefik.http.services.archbase-react-docs.loadbalancer.server.port=80"
        - "traefik.http.routers.archbase-react-docs-http.rule=Host(`react.archbase.dev`)"
        - "traefik.http.routers.archbase-react-docs-http.entrypoints=web"
        - "traefik.http.routers.archbase-react-docs-http.middlewares=redirect-to-https"

  # Documentação Flutter - flutter.archbase.dev
  flutter-docs:
    <<: *default-opts
    image: ghcr.io/integrall-tech/archbase-flutter-docs:${FLUTTER_DOCS_TAG:-latest}
